<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search | YGO API</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/search">Search</a>
    </div>

    <div class="nav-actions">
      <a class="nav-button nav-login" href="/account#login-form">Log in</a>
      <a class="nav-button nav-signup" href="/account#signup-form">Sign up</a>
      <span id="welcomeText"></span>
      <button class="nav-button nav-logout" id="logoutBtn" type="button">Logout</button>
    </div>
  </nav>

  <main>
    <h1 class="search-title">Card finder</h1>

    <form id="myForm" class="search-form">
      <label for="card-filters">Search by</label>
      <select name="filters" id="card-filters">
        <option value="name" selected>Name</option>
        <option value="attribute">Attribute</option>
        <option value="type">Type</option>
        <option value="race">Race</option>
        <option value="level">Level</option>
      </select>

      <label for="level_filter" hidden>Level</label>
      <select name="level_filter" id="level_filter" aria-label="Level">
        <option value="" selected>Select a level</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
      </select>

      <label for="searchInput" hidden>Search term</label>
      <input type="search" id="searchInput" name="search" placeholder="Search card..." class="search-input" />

      <button type="submit" class="search-submit">Search</button>

      <label for="limitResults" class="results-label">Results per page</label>
      <select name="limit" id="limitResults">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
      </select>
    </form>

    <p id="resultsSummary" aria-live="polite"></p>
    <div id="searchResults"></div>
  </main>

  <nav id="paginationContainer" aria-label="Search results pages" hidden>
    <button type="button" class="prev-btn">&laquo; Prev</button>
    <div id="pageNumbers"></div>
    <button type="button" class="next-btn">Next &raquo;</button>
  </nav>

  <footer class="footer">
    <p>© 2026 rnhaneul</p>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/authUI.js"></script>
</body>

</html>
