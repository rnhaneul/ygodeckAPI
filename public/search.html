<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search | YGO API</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/search">Search</a>
    </div>
  </nav>

  <main>
    <h1 style="text-align: center; margin-top: 30px">Card finder</h1>

    <form id="myForm" style="display: flex; justify-content: center; gap: 12px; margin: 20px auto;">
      <select name="filters" id="card-filters">
        <option value="name" selected>Name</option>
        <option value="attribute">Attribute</option>
        <option value="type">Type</option>
        <option value="race">Race</option>
        <option value="level">Level</option>
      </select>
      <input type="number" name="level_filter" id="level_filter" max="13" min="0" style="display: none;" />
      <input type="search" id="searchInput" name="search" placeholder="Search card..." style="
          padding: 10px 14px;
          border-radius: 999px;
          border: 1px solid #88304E;
          width: 300px;
          background: rgba(248, 237, 241, 0.08);
          color: #f8edf1;
          outline: none;
          box-shadow: none;
        " />
      <button type="submit" style="
          padding: 10px 18px;
          border-radius: 999px;
          border: none;
          background: #E23E57;
          color: #f8edf1;
          font-weight: bold;
          cursor: pointer;
        ">
        Search
      </button>
    </form>

    <div id="searchResults"></div>
  </main>
  <nav id="paginationContainer" aria-label="Search results pages">
    <button type="button" class="prev-btn">&laquo; Prev</button>
    <div id="pageNumbers"></div>
    <button type="button" class="next-btn">Next &raquo;</button>
  </nav>
  <footer class="footer">
    <p>© 2026 rnhaneul</p>
  </footer>
  <script src="/main.js"></script>
</body>

</html>
