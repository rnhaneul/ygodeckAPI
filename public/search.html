<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search | YGO API</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/search">Search</a>
    </div>
  </nav>

  <main>
    <h1 style="text-align: center; margin-top: 30px">Card finder</h1>

    <form id="myForm" style="display: flex; justify-content: center; gap: 12px; margin: 20px auto">
      <label for="search" style="display: none">Search</label>
      <input type="search" id="searchInput" name="search" placeholder="Search card..."
        style="padding: 10px 14px; border-radius: 999px; border: 1px solid #ddd; width: 300px" />
      <button type="submit" style="
                        padding: 10px 18px;
                        border-radius: 999px;
                        border: none;
                        background: #f4b942;
                        font-weight: bold;
                        cursor: pointer;
                    ">
        Search
      </button>
    </form>

    <div id="searchResults"></div>
  </main>
  <footer class="footer">
    <p>© 2026 rnhaneul</p>
  </footer>
  <script src="/main.js"></script>
</body>

</html>
