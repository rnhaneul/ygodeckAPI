<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search | YGO API</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/search">Search</a>
    </div>
  </nav>

  <main>
    <h1 class="search-title">Card finder</h1>

    <form id="myForm" class="search-form">
      <select name="filters" id="card-filters">
        <option value="name" selected>Name</option>
        <option value="attribute">Attribute</option>
        <option value="type">Type</option>
        <option value="race">Race</option>
        <option value="level">Level</option>
      </select>
      <input type="number" name="level_filter" id="level_filter" max="13" min="0" />
      <input type="search" id="searchInput" name="search" placeholder="Search card..." class="search-input" />
      <button type="submit" class="search-submit">Search</button>
      <label for="limitResults" class="results-label">Results per page</label>
      <select name="limit" id="limitResults">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
      </select>
    </form>

    <div id="searchResults"></div>
  </main>
  <nav id="paginationContainer" aria-label="Search results pages">
    <button type="button" class="prev-btn">&laquo; Prev</button>
    <div id="pageNumbers"></div>
    <button type="button" class="next-btn">Next &raquo;</button>
  </nav>
  <footer class="footer">
    <p>© 2026 rnhaneul</p>
  </footer>
  <script src="/js/main.js"></script>
</body>

</html>
