<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yu-Gi-Oh! Card Finder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.js"></script>
  <style>
    body {
      margin: 0%;
      background-color: rgb(56, 52, 49);
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      color: aliceblue;
    }

    h1 {
      display: flex;
      justify-content: center;
    }

    #formDiv {
      display: flex;
      justify-content: center;
    }

    #resultImages {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cardImgs {
      max-height: 450px;
      margin: 18px;
    }
  </style>
</head>

<body>
  <header>
    <H1>Card finder</H1>
  </header>
  <div id="formDiv">
    <form method="get" id="myForm">
      <label for="search">Search</label>
      <input type="search" name="search" id="searchInput" placeholder="name, atk, def, level ...">
      <button type="submit">Search</button>
    </form>
  </div>
  <main>
    <div id="searchResults"></div>
    <div id="resultImages"></div>
  </main>
  <script type="module" src="main.js"></script>
</body>

</html>
